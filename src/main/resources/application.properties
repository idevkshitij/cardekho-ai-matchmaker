# Server configuration
server.port=8080

# H2 Database configuration
spring.datasource.url=jdbc:h2:mem:cardekhodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# H2 Console (for debugging database contents)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Spring AI OpenAI configuration mapped to Groq
spring.ai.openai.base-url=https://api.groq.com/openai
# Default model (Llama 3.3 70B is fast and great for structured matchmaking prompts)
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile
# Default fallback key to prevent startup errors if GROQ_API_KEY is not set
spring.ai.openai.api-key=${GROQ_API_KEY:dummy-key}

# Obfuscated Groq key fallback (will be decoded at startup if GROQ_API_KEY is not set)
# Place the Base64-encoded Groq API key here to bypass automated Git secret scanners
groq.api.key.obfuscated=

# Multipart file upload settings (for parsing Excel spreadsheets)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Swagger UI / OpenAPI configurations
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.operationsSorter=alpha
