services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8080:8080"
    environment:
      # You can permanently set your Groq API key here if you don't want to use the UI!
      - GROQ_API_KEY=${GROQ_API_KEY:-}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://backend:8080
    depends_on:
      - backend
